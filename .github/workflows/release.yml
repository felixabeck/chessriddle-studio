name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One draft per tag; every matrix leg uploads into it so latest.json covers all platforms.
  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.mjs
          sparse-checkout-cone-mode: false

      # The release text is the tag's section of CHANGELOG.md; a missing, empty or raw-HTML
      # section fails here, before any build leg starts.
      - name: Extract the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The id comes from the create response itself: listing releases right after creating
          # the draft returned nothing on the first release (run 42286539160), so every leg
          # built and then skipped its upload.
          release_id=$(jq -n --arg tag "$TAG" --rawfile body "$RUNNER_TEMP/release-notes.md" \
              '{tag_name: $tag, name: $tag, draft: true, body: $body}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input - --jq .id)
          case "$release_id" in
            ''|*[!0-9]*) echo "::error::draft release for $TAG has no numeric id: '$release_id'"; exit 1 ;;
          esac
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  # macOS legs build `app` beside `dmg`: the updater's darwin entry is the signed .app.tar.gz,
  # which only the app bundle produces (run 42296138869 lacked darwin in latest.json).
  # A manual dispatch never gets a draft, whatever ref it runs on: every leg builds, signs and
  # notarizes, and uploads nothing. That is the rehearsal for a signing change.
  # (`${{ }}` is required here: a bare leading `!` is a YAML tag.)
  release:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.create-release.result == 'skipped')) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            target: aarch64-apple-darwin
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            target: x86_64-apple-darwin
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      # With any of these empty the bundler falls back to the ad-hoc identity in tauri.conf.json
      # or skips notarization, and the leg would only fail in the verification step after a full
      # build and upload. Notarization reads the App Store Connect key from a file.
      - name: Require the Apple secrets and write the notarization key (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::secret $name is empty"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # The Safari version of the browser extension ships inside the application bundle
      # (d-20261122-33). It is built and signed here, before the Rust build, so a packaging failure
      # ends the leg within minutes. The certificate goes into a keychain of its own that is gone
      # again before the bundler imports the same identity: two keychains holding one identity make
      # `codesign -s` ambiguous. The bundler copies `bundle.macOS.files` without signing them and
      # signs the application without --deep, so the bundle keeps this signature and its sandbox
      # entitlement. A failed build or a failed cleanup fails the step; the configuration that
      # embeds the bundle is written only after both succeeded.
      - name: Build and embed the Safari extension (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          version=$(awk -F'"' '/^version = /{ print $2; exit }' src-tauri/Cargo.toml)
          [ -n "$version" ] || { echo "::error::no version in src-tauri/Cargo.toml"; exit 1; }
          output="$RUNNER_TEMP/safari-extension"
          keychain="$RUNNER_TEMP/safari-signing.keychain-db"
          certificate="$RUNNER_TEMP/safari-signing.p12"
          password=$(openssl rand -hex 24)
          previous=()
          while IFS= read -r line; do previous+=("$line"); done \
            < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          [ "${#previous[@]}" -gt 0 ] || { echo "::error::the runner has no user keychain search list"; exit 1; }
          build() {
            security create-keychain -p "$password" "$keychain" &&
              security set-keychain-settings "$keychain" &&
              security unlock-keychain -p "$password" "$keychain" &&
              printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate" &&
              security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null &&
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null &&
              security list-keychains -d user -s "$keychain" "${previous[@]}" &&
              bash browser-extension/scripts/build-safari-appex.sh "$output" "$version"
          }
          cleanup() {
            status=0
            rm -f "$certificate" || status=1
            security list-keychains -d user -s "${previous[@]}" || status=1
            if [ -e "$keychain" ]; then security delete-keychain "$keychain" || status=1; fi
            return "$status"
          }
          # A cancelled or timed-out step leaves through the trap; the ordinary path cleans up
          # itself, so that a failed cleanup fails the step.
          trap 'cleanup > /dev/null 2>&1 || true' EXIT
          result=0
          build || result=$?
          cleanup || { echo "::error::the temporary signing keychain or the certificate file could not be removed"; result=1; }
          trap - EXIT
          [ "$result" -eq 0 ] || exit "$result"
          # Tauri merges src-tauri/tauri.macos.conf.json on macOS.
          APPEX="$output/ChessRiddle Studio Extension.appex" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const files = { "PlugIns/ChessRiddle Studio Extension.appex": process.env.APPEX };
            writeFileSync("src-tauri/tauri.macos.conf.json", JSON.stringify({ bundle: { macOS: { files } } }));
          '

      # Windows signing uses the Certum "Open Source Code Signing in the Cloud" certificate. Its key
      # never leaves Certum: SimplySign Desktop, logged in with the account's TOTP, exposes it as a
      # certificate in CurrentUser\My for signtool. The action is pinned to the commit that was read
      # in full before its first use (installs Certum's MSI from files.certum.eu, types the login
      # into the desktop dialog, masks the code). The TOTP seed reaches only that step.
      - name: Log in to Certum SimplySign (Windows only)
        id: certum
        if: runner.os == 'Windows'
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}

      # Tauri merges src-tauri/tauri.windows.conf.json on Windows. The thumbprint is read from the
      # store instead of committed, so a renewed certificate needs no change here.
      - name: Point the bundler at the Certum certificate (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.certum.outputs.cert-thumbprint }}
        run: |
          if (-not $env:THUMBPRINT) { Write-Error "no Certum certificate thumbprint"; exit 1 }
          @{ bundle = @{ windows = @{
            certificateThumbprint = $env:THUMBPRINT
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://time.certum.pl'
            tsp = $true
          } } } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM src-tauri/tauri.windows.conf.json

      - name: Build the app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Developer ID signing and notarization; the Apple secrets stay off the other legs.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          CI: false
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # The publish job needs every leg green, so a bundle that is not signed with the Developer ID
      # and notarized never leaves the draft. The disk image only carries the signature: its app
      # holds the stapled ticket, and Gatekeeper's verdict on the image is printed for the record.
      - name: Verify signature and notarization (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          set -- "$bundle"/macos/*.app
          app=$1
          [ -d "$app" ] || { echo "::error::no .app bundle for ${{ matrix.target }}"; exit 1; }
          set -- "$bundle"/dmg/*.dmg
          dmg=$1
          [ -f "$dmg" ] || { echo "::error::no .dmg for ${{ matrix.target }}"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          assessment=$(spctl --assess --type execute --verbose=4 "$app" 2>&1) || { echo "$assessment"; exit 1; }
          echo "$assessment"
          case "$assessment" in
            *"source=Notarized Developer ID"*) ;;
            *) echo "::error::Gatekeeper accepted the app, but not as a notarized Developer ID build"; exit 1 ;;
          esac
          codesign --verify --strict --verbose=2 "$dmg"
          # Tauri notarizes the app but only signs the disk image, which Gatekeeper then reports as
          # "Unnotarized Developer ID". Notarizing registers the image's hash with Apple and leaves
          # the file untouched, so the copy tauri-action already uploaded stays the notarized one.
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          dmg_assessment=$(spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1) || { echo "$dmg_assessment"; exit 1; }
          echo "$dmg_assessment"
          case "$dmg_assessment" in
            *"source=Notarized Developer ID"*) ;;
            *) echo "::error::Gatekeeper accepted the disk image, but not as a notarized Developer ID build"; exit 1 ;;
          esac

      # Like the macOS check: an installer or app binary that is not signed by the Certum
      # certificate with a timestamp fails the leg, so it never leaves the draft. The timestamp
      # keeps the signature valid after the one-year certificate expires. The app binary is
      # checked inside the installer: the bundler signs it, packs it and then restores the
      # unsigned build in target/release (tauri-bundler bundle.rs, run 44302689681).
      - name: Verify the Authenticode signatures (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.certum.outputs.cert-thumbprint }}
        run: |
          $installers = @(Get-ChildItem -ErrorAction SilentlyContinue src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { Write-Error "expected one NSIS installer, found $($installers.Count)"; exit 1 }
          $unpacked = Join-Path $env:RUNNER_TEMP 'nsis-unpacked'
          7z x -y "-o$unpacked" $installers[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "7z could not unpack the installer (exit $LASTEXITCODE)"; exit 1 }
          $apps = @(Get-ChildItem -Recurse -File -Filter chessriddle-studio.exe $unpacked)
          if ($apps.Count -ne 1) { Write-Error "expected one chessriddle-studio.exe in the installer, found $($apps.Count)"; exit 1 }
          $app = $apps[0]
          $failed = $false
          foreach ($f in @($installers[0], $app)) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) ($($sig.StatusMessage)) | $($sig.SignerCertificate.Subject) $($sig.SignerCertificate.Thumbprint) | timestamp: $($null -ne $sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Thumbprint -ne $env:THUMBPRINT -or -not $sig.TimeStamperCertificate) {
              Write-Host "::error::$($f.Name) is not validly signed and timestamped with the Certum certificate"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # A game link clicked in the browser reaches the app only if the installed package
      # registers the chessriddle-studio scheme (tauri.conf.json plugins.deep-link, read by the
      # bundler) and passes the link on. Each leg proves that on its own artefact, so a bundler or
      # template change that drops the registration never leaves the draft.
      - name: Verify the game-link scheme registration (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -- "src-tauri/target/${{ matrix.target }}/release/bundle"/macos/*.app
          plist="$1/Contents/Info.plist"
          [ -f "$plist" ] || { echo "::error::no Info.plist in the .app bundle for ${{ matrix.target }}"; exit 1; }
          url_types=$(plutil -extract CFBundleURLTypes json -o - "$plist") || { echo "::error::Info.plist declares no URL types"; exit 1; }
          echo "$url_types"
          echo "$url_types" | jq -e 'any(.[]; (.CFBundleURLSchemes // []) | index("chessriddle-studio") != null)' > /dev/null \
            || { echo "::error::Info.plist does not register the chessriddle-studio scheme"; exit 1; }

      # A desktop entry without a field code is started without the link (measured with
      # `gio launch`, 2026-11-22), so each Linux package must carry %u beside the MimeType.
      - name: Verify the game-link scheme registration (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle=src-tauri/target/release/bundle
          work="$RUNNER_TEMP/scheme-check"
          mkdir -p "$work/deb" "$work/rpm" "$work/appimage"
          sudo apt-get install -y libarchive-tools
          one() { [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::expected exactly one $label package, found: $*"; exit 1; }; }
          label=deb; set -- "$bundle"/deb/*.deb; one "$@"
          dpkg-deb -x "$1" "$work/deb"
          label=rpm; set -- "$bundle"/rpm/*.rpm; one "$@"
          # bsdtar, not rpm2cpio: rpm2cpio 4.18 exits 1 without a message on the bundler's rpm,
          # although what it writes is complete (measured 2026-11-22, release rehearsal 45031059660).
          bsdtar -xf "$1" -C "$work/rpm"
          label=AppImage; set -- "$bundle"/appimage/*.AppImage; one "$@"
          chmod +x "$1"
          appimage=$(realpath "$1")
          (cd "$work/appimage" && "$appimage" --appimage-extract > /dev/null)
          failed=0
          for label in deb rpm appimage; do
            # The AppImage also links its entry at the top level; the packaged file is the one read.
            entries=$(find "$work/$label" -path '*/usr/share/applications/*.desktop' -type f)
            [ -n "$entries" ] && [ "$(printf '%s\n' "$entries" | wc -l)" -eq 1 ] \
              || { echo "::error::expected exactly one desktop entry in the $label package, found: $entries"; failed=1; continue; }
            echo "== $label: $entries"; cat "$entries"
            grep -Eq '^MimeType=(.*;)?x-scheme-handler/chessriddle-studio(;|$)' "$entries" \
              || { echo "::error::the $label desktop entry does not register the chessriddle-studio scheme"; failed=1; }
            grep -Eq '^Exec=.* %u$' "$entries" \
              || { echo "::error::the $label desktop entry does not pass the link (%u) to the app"; failed=1; }
          done
          exit "$failed"

      # The installer writes the scheme into the registry, not into a file, so it is installed
      # (per user, silently) and the keys are read back.
      - name: Verify the game-link scheme registration (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -ErrorAction SilentlyContinue src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { Write-Error "expected one NSIS installer, found $($installers.Count)"; exit 1 }
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { Write-Error "the silent install failed (exit $($install.ExitCode))"; exit 1 }
          $key = 'HKCU:\Software\Classes\chessriddle-studio'
          if (-not (Test-Path $key)) { Write-Host "::error::the installer did not register the chessriddle-studio scheme"; exit 1 }
          $protocol = (Get-Item $key).GetValue('URL Protocol', $null)
          $command = (Get-Item "$key\shell\open\command" -ErrorAction SilentlyContinue)?.GetValue('')
          Write-Host "URL Protocol: '$protocol' | open command: $command"
          if ($null -eq $protocol) { Write-Host "::error::the chessriddle-studio key is not marked as a URL protocol"; exit 1 }
          if ($command -notmatch 'chessriddle-studio\.exe" "%1"$') { Write-Host "::error::the open command does not pass the link (`"%1`") to the app"; exit 1 }

      # The leg fails unless the application and the application inside the disk image carry
      # exactly one Safari extension that is signed, sandboxed, hardened, of the application's team
      # and version, and that the system accepts as a Safari web extension. The deep verification,
      # the stapler and Gatekeeper above already cover the nested bundle.
      - name: Verify the embedded Safari extension (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          identifier=com.chessriddle.studio.Extension
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          set -- "$bundle"/macos/*.app
          app=$1
          [ -d "$app" ] || { echo "::error::no .app bundle for ${{ matrix.target }}"; exit 1; }
          set -- "$bundle"/dmg/*.dmg
          dmg=$1
          [ -f "$dmg" ] || { echo "::error::no .dmg for ${{ matrix.target }}"; exit 1; }
          fail() { echo "::error::$*"; exit 1; }
          field() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2> /dev/null; }
          team() { codesign -dv "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p'; }
          verify() {
            application=$1
            count=$(find "$application/Contents/PlugIns" -maxdepth 1 -name '*.appex' 2> /dev/null | wc -l | tr -d ' ')
            [ "$count" = 1 ] || fail "expected one .appex in $application/Contents/PlugIns, found $count"
            appex=$(find "$application/Contents/PlugIns" -maxdepth 1 -name '*.appex')
            codesign --verify --strict --verbose=2 "$appex" || fail "the signature of $appex does not verify"
            entitlements="$RUNNER_TEMP/safari-extension-entitlements.plist"
            codesign -d --entitlements - --xml "$appex" > "$entitlements" 2> /dev/null || fail "$appex carries no readable entitlements"
            [ "$(field "$entitlements" com.apple.security.app-sandbox)" = true ] || fail "$appex is not sandboxed"
            # Read in full first: a reader that stops at its match would end codesign with a broken
            # pipe, which pipefail reports as a failure.
            signature=$(codesign -dv "$appex" 2>&1) || fail "the signature of $appex cannot be read"
            case "$signature" in
              *flags=*runtime*) ;;
              *) fail "$appex lacks the hardened runtime" ;;
            esac
            application_team=$(team "$application")
            case "$application_team" in ''|'not set') fail "$application has no team identifier" ;; esac
            [ "$(team "$appex")" = "$application_team" ] || fail "$appex is not signed by the application's team"
            [ "$(field "$appex/Contents/Info.plist" CFBundleIdentifier)" = "$identifier" ] || fail "$appex is not $identifier"
            application_version=$(field "$application/Contents/Info.plist" CFBundleShortVersionString)
            [ -n "$application_version" ] || fail "$application has no version"
            [ "$(field "$appex/Contents/Info.plist" CFBundleShortVersionString)" = "$application_version" ] || fail "$appex does not carry the application's version $application_version"
            echo "verified $appex ($identifier $application_version, team $application_team)"
          }
          verify "$app"
          # Registering the application first mirrors what opening it does for a user; the listing
          # below is what decides.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app" \
            || echo "note: lsregister did not register the application"
          set -- "$app"/Contents/PlugIns/*.appex
          pluginkit -a "$1"
          listed=""
          for _ in 1 2 3 4 5; do
            listed=$(pluginkit -m -A -v -p com.apple.Safari.web-extension 2>&1 || true)
            case "$listed" in *"$identifier"*) break ;; esac
            sleep 2
          done
          echo "$listed"
          case "$listed" in *"$identifier"*) ;; *) fail "the system does not list $identifier as a Safari web extension" ;; esac
          mount="$RUNNER_TEMP/safari-extension-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" > /dev/null
          set -- "$mount"/*.app
          verify "$1"
          hdiutil detach "$mount" > /dev/null

      # Nobody in the project has a Mac, and Safari has blocked Developer ID-signed web extensions
      # before (Apple developer forum threads 667859 and 695373), against Apple's documentation. This
      # step opens the application and Safari on the runner and reads Safari's log for such a block.
      # It never fails or stalls a release: a Studio release must not depend on Safari policy. It
      # ends with one line, "SAFARI: BLOCK OBSERVED", "SAFARI: no block observed" (not proof that
      # Safari loads the extension) or "SAFARI: observation unavailable: <reason>"; a run without
      # such a line (a timeout) counts as unavailable. Rehearsal 45101297031 showed that the log
      # masks identifiers as <private> and that a quiet Safari logs nothing about web extensions
      # at all, so a block counts without naming the extension, and silence counts as unavailable.
      - name: Observe the Safari verdict on the extension (macOS only, informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          identifier=com.chessriddle.studio.Extension
          set -- "src-tauri/target/${{ matrix.target }}/release/bundle"/macos/*.app
          app=$1
          finish() {
            pkill -x Safari || true
            pkill -x chessriddle-studio || true
            echo "SAFARI: $1"
            exit 0
          }
          started=$(date '+%Y-%m-%d %H:%M:%S')
          # Opening the application once is what registers its extension for a user.
          open -g "$app" || finish "observation unavailable: the application did not open"
          sleep 15
          open -g -a Safari || finish "observation unavailable: Safari did not open"
          sleep 40
          pluginkit -m -A -v -p com.apple.Safari.web-extension || true
          # Safari's own record of the web extensions it knows, for the reader of this log; macOS
          # may refuse another process the access.
          plutil -p "$HOME/Library/Containers/com.apple.Safari/Data/Library/Safari/WebExtensions/Extensions.plist" 2>&1 | head -n 40 || true
          lines=$(log show --start "$started" --info --style compact --predicate 'process CONTAINS "Safari"' 2>&1) \
            || finish "observation unavailable: the unified log could not be read"
          # The script prints the lines about web extensions and, last, the verdict.
          report=$(printf '%s\n' "$lines" | bash browser-extension/scripts/safari-observation-verdict.sh) \
            || finish "observation unavailable: the log could not be classified"
          printf '%s\n' "$report"
          verdict=$(printf '%s\n' "$report" | tail -n 1)
          if [ "$verdict" = "BLOCK OBSERVED" ]; then echo "::warning::Safari reports that it blocks $identifier"; fi
          finish "$verdict"

      - name: Log out of Certum SimplySign (Windows only)
        if: always() && steps.certum.outcome != 'skipped'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87 # v1

  # Undrafts only after every leg succeeded and latest.json names all four platforms.
  publish:
    needs: [create-release, release]
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify latest.json and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP"
          for platform in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' \
              "$RUNNER_TEMP/latest.json" > /dev/null || { echo "latest.json lacks $platform"; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
