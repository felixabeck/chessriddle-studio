name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One draft per tag; every matrix leg uploads into it so latest.json covers all platforms.
  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The id comes from the create response itself: listing releases right after creating
          # the draft returned nothing on the first release (run 42286539160), so every leg
          # built and then skipped its upload.
          release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="$TAG" -F draft=true \
            -f body="See the assets to download and install this version." --jq .id)
          case "$release_id" in
            ''|*[!0-9]*) echo "::error::draft release for $TAG has no numeric id: '$release_id'"; exit 1 ;;
          esac
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  # macOS legs build `app` beside `dmg`: the updater's darwin entry is the signed .app.tar.gz,
  # which only the app bundle produces (run 42296138869 lacked darwin in latest.json).
  # A manual dispatch never gets a draft, whatever ref it runs on: every leg builds, signs and
  # notarizes, and uploads nothing. That is the rehearsal for a signing change.
  # (`${{ }}` is required here: a bare leading `!` is a YAML tag.)
  release:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.create-release.result == 'skipped')) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            target: aarch64-apple-darwin
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            target: x86_64-apple-darwin
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      # With any of these empty the bundler falls back to the ad-hoc identity in tauri.conf.json
      # or skips notarization, and the leg would only fail in the verification step after a full
      # build and upload. Notarization reads the App Store Connect key from a file.
      - name: Require the Apple secrets and write the notarization key (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::secret $name is empty"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build the app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Developer ID signing and notarization; the Apple secrets stay off the other legs.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          CI: false
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # The publish job needs every leg green, so a bundle that is not signed with the Developer ID
      # and notarized never leaves the draft. The disk image only carries the signature: its app
      # holds the stapled ticket, and Gatekeeper's verdict on the image is printed for the record.
      - name: Verify signature and notarization (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          set -- "$bundle"/macos/*.app
          app=$1
          [ -d "$app" ] || { echo "::error::no .app bundle for ${{ matrix.target }}"; exit 1; }
          set -- "$bundle"/dmg/*.dmg
          dmg=$1
          [ -f "$dmg" ] || { echo "::error::no .dmg for ${{ matrix.target }}"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          assessment=$(spctl --assess --type execute --verbose=4 "$app" 2>&1) || { echo "$assessment"; exit 1; }
          echo "$assessment"
          case "$assessment" in
            *"source=Notarized Developer ID"*) ;;
            *) echo "::error::Gatekeeper accepted the app, but not as a notarized Developer ID build"; exit 1 ;;
          esac
          codesign --verify --strict --verbose=2 "$dmg"
          # Tauri notarizes the app but only signs the disk image, which Gatekeeper then reports as
          # "Unnotarized Developer ID". Notarizing registers the image's hash with Apple and leaves
          # the file untouched, so the copy tauri-action already uploaded stays the notarized one.
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          dmg_assessment=$(spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1) || { echo "$dmg_assessment"; exit 1; }
          echo "$dmg_assessment"
          case "$dmg_assessment" in
            *"source=Notarized Developer ID"*) ;;
            *) echo "::error::Gatekeeper accepted the disk image, but not as a notarized Developer ID build"; exit 1 ;;
          esac

  # Undrafts only after every leg succeeded and latest.json names all four platforms.
  publish:
    needs: [create-release, release]
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify latest.json and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP"
          for platform in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' \
              "$RUNNER_TEMP/latest.json" > /dev/null || { echo "latest.json lacks $platform"; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
