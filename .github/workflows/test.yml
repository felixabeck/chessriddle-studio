name: Test
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Install Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Prepare frontend distribution directory
        shell: bash
        run: mkdir -p dist

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Clippy all Rust targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  rust-macos-test:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # macOS temp dirs live under the /var symlink, and the path authority deliberately refuses
      # symlinked ancestors, so the tests need a canonical temp root.
      - name: Use a canonical temporary directory
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Prepare frontend distribution directory
        shell: bash
        run: mkdir -p dist

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  rust-windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Prepare frontend distribution directory
        shell: bash
        run: mkdir -p dist

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Mount FAT32 and exFAT measurement volumes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($filesystem in @('FAT32', 'exFAT')) {
            $vhd = Join-Path $env:RUNNER_TEMP "chessfable-$filesystem.vhd"
            New-VHD -Path $vhd -SizeBytes 260MB -Fixed | Out-Null
            $disk = Mount-VHD -Path $vhd -Passthru | Get-Disk
            $disk | Initialize-Disk -PartitionStyle MBR
            $partition = $disk | New-Partition -UseMaximumSize -AssignDriveLetter
            $partition | Format-Volume -FileSystem $filesystem -Confirm:$false | Out-Null
            $root = "$($partition.DriveLetter):\"
            "CHESSFABLE_$($filesystem.ToUpperInvariant())_ROOT=$root" >> $env:GITHUB_ENV
          }
          $measurement = Join-Path $env:RUNNER_TEMP 'chessfable-volume-measurement.txt'
          "CHESSFABLE_VOLUME_MEASUREMENT=$measurement" >> $env:GITHUB_ENV

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Print and check volume measurements
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = Get-Content -LiteralPath $env:CHESSFABLE_VOLUME_MEASUREMENT
          $lines | Write-Output
          foreach ($filesystem in @('fat32', 'exfat')) {
            foreach ($operation in @('replace', 'unlink')) {
              $pattern = "^$filesystem $operation -?[0-9]+ committed$"
              if (@($lines | Where-Object { $_ -cmatch $pattern }).Count -ne 1) {
                throw "Expected exactly one $filesystem $operation measurement"
              }
            }
            $pattern = "^$filesystem mapped-replace (- unavailable|-?[0-9]+ (committed|error))$"
            if (@($lines | Where-Object { $_ -cmatch $pattern }).Count -ne 1) {
              throw "Expected exactly one $filesystem mapped-replace measurement"
            }
          }

      - name: Dismount measurement volumes
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          foreach ($filesystem in @('FAT32', 'exFAT')) {
            $vhd = Join-Path $env:RUNNER_TEMP "chessfable-$filesystem.vhd"
            try {
              if ((Test-Path -LiteralPath $vhd) -and (Get-VHD -Path $vhd).Attached) {
                Dismount-VHD -Path $vhd
              }
            } catch {
              $failures += $_
              Write-Output $_
            }
          }
          if ($failures.Count -gt 0) {
            throw 'Failed to dismount measurement volumes'
          }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up repository dependencies
        uses: ./.github/actions/setup-ci
        with:
          desktop: "true"

      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run the contract gate
        run: pnpm gates:contract:check

      - name: Run frontend tests and coverage
        run: pnpm test:coverage

      - name: Enforce frontend coverage ratchet
        run: pnpm coverage:frontend:check

      - name: Build frontend
        run: pnpm build-vite

      - name: Verify generated bindings
        # After `build-vite`, not before: this compiles the Tauri binary, and
        # `tauri::generate_context!()` panics when `frontendDist` (`../dist`) does not
        # exist. Locally the directory is usually left over from an earlier build, which
        # is why the ordering held on a developer machine and failed on a clean runner.
        run: pnpm bindings:check

      - name: Enforce frontend bundle budgets
        run: pnpm bundle:check

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up repository dependencies
        uses: ./.github/actions/setup-ci

      - name: Run browser accessibility and visual contracts
        # Inside the pinned Playwright image, whose rendering the committed screenshots
        # match. Running this natively compares the runner's font rasterization against
        # the container's and can fail on antialiasing alone. The image ships the
        # browsers, so no separate `playwright install` step is needed.
        run: pnpm test:e2e:container

      - name: Upload browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-audit
          path: artifacts/frontend-audit/
          # `warn`, not `error`: see the mutation report upload below.
          if-no-files-found: warn

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up repository dependencies
        uses: ./.github/actions/setup-ci
        with:
          desktop: "true"

      - name: Install Rust toolchain
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri embeds frontendDist at compile time, even in this independent Rust job.
      - name: Prepare frontend distribution directory
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check and lint all Rust targets
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Install pinned Rust coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Install pinned Rust coverage toolchain
        run: rustup toolchain install nightly-2025-06-01 --profile minimal --component llvm-tools-preview

      - name: Run Rust tests with coverage
        run: pnpm test:coverage:backend

      - name: Enforce backend coverage ratchet
        run: pnpm coverage:backend:check

      - name: Upload backend coverage
        # `always()`: the measurement is the evidence needed to diagnose a RED ratchet, so
        # uploading it only on success withholds it exactly when it is wanted. The frontend
        # coverage upload above has the same problem and the same fix.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage/
          if-no-files-found: warn

  frontend-mutation-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: List frontend mutation packages
        id: list
        run: echo "ids=$(node scripts/run-frontend-mutation.mjs --list-packages)" >> "$GITHUB_OUTPUT"

  frontend-mutation:
    needs: frontend-mutation-packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.frontend-mutation-packages.outputs.ids) }}
    env:
      FRONTEND_MUTATION_PACKAGE: ${{ matrix.package }}
      FRONTEND_MUTATION_INCREMENTAL_DIR: .frontend-mutation-incremental
      FRONTEND_MUTATION_CHANGED_SINCE: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up repository dependencies
        uses: ./.github/actions/setup-ci

      - name: Compute UTC cache dates
        id: dates
        run: |
          today=$(date -u +%Y%m%d)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(date -u -d "$today -1 day" +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Only forced full sweeps publish caches. Today's and yesterday's prefixes bound
      # reuse, and this deliberately unmatched key prevents an exact cache hit.
      - name: Restore recent full mutation results
        uses: actions/cache/restore@v4
        with:
          path: .frontend-mutation-incremental
          key: frontend-mutation-restore-${{ matrix.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            frontend-mutation-full-${{ matrix.package }}-${{ steps.dates.outputs.today }}-
            frontend-mutation-full-${{ matrix.package }}-${{ steps.dates.outputs.yesterday }}-

      - name: Run targeted frontend mutation tests
        # Each package gets its own runner. The runner skips only when the complete
        # frontend input superset is unchanged, and otherwise enforces the same thresholds.
        run: pnpm mutation:frontend

      - name: Upload frontend mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-mutation-${{ matrix.package }}
          path: artifacts/mutation/frontend/${{ matrix.package }}/
          # A missing report on failure must not bury the original error.
          if-no-files-found: warn
