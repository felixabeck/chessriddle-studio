name: Install Linux desktop build dependencies
description: Install the WebKitGTK desktop build packages from an actions/cache-backed .deb cache, with a wall-clock bound on the mirror traffic
inputs:
  timeout-minutes:
    description: >-
      Wall-clock bound in minutes, shared by `apt-get update` and the package download.
      Empty means no bound. Any other value must be a positive number.
    default: ""
runs:
  using: composite
  steps:
    # Order: update -> resolve the download set -> restore -> verify -> download -> prune -> save
    # -> install. Composite steps accept no `timeout-minutes`, so the bound is a deadline carried
    # in GITHUB_ENV and enforced by `sudo timeout` around each apt network command.
    - name: Update apt and resolve the download set
      id: resolve
      shell: bash
      env:
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        set -uo pipefail
        archives=/tmp/linux-desktop-apt-archives
        lib="$RUNNER_TEMP/linux-desktop-deps-lib.sh"
        set_file="$RUNNER_TEMP/linux-desktop-deps-set.txt"
        packages=(
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
        )

        # desktop_deps_label_stall <phase> <status>: annotates a failed apt command as a mirror
        # stall, only when a bound is set and the elapsed time reached it. <status> 124 is the
        # `timeout` expiry, 137 the SIGKILL that follows --kill-after. Any other status, an
        # OOM-killed apt before the deadline and every unbounded run keep apt's own output.
        # Elapsed time comes from the integer `date +%s`, the same source as the remaining time in
        # desktop_deps_apt, so a real exit at the bound always sees elapsed >= bound.
        desktop_deps_label_stall() {
          local elapsed
          if [ -z "$LINUX_DESKTOP_DEPS_DEADLINE" ] || [ "$LINUX_DESKTOP_DEPS_BOUND" -le 0 ]; then return 0; fi
          if [ "$2" -ne 124 ] && [ "$2" -ne 137 ]; then return 0; fi
          elapsed=$(($(date +%s) - LINUX_DESKTOP_DEPS_START))
          if [ "$elapsed" -ge "$LINUX_DESKTOP_DEPS_BOUND" ]; then
            echo "::error::linux-desktop-deps: mirror stall: apt-get $1 was stopped after ${elapsed}s, past the ${LINUX_DESKTOP_DEPS_BOUND}s bound"
          fi
        }
        # desktop_deps_apt <phase> <apt-get argument>...: runs `sudo apt-get <arguments>` and returns
        # apt's own status. With a deadline set, the command runs as `sudo timeout --kill-after`
        # for the time that remains; a deadline already used up fails at once. <phase> (update or
        # download) only names the stall in the annotation.
        desktop_deps_apt() {
          local phase=$1 kill_grace=10 now remaining rc=0
          shift
          if [ -n "$LINUX_DESKTOP_DEPS_DEADLINE" ]; then
            now=$(date +%s)
            remaining=$((LINUX_DESKTOP_DEPS_DEADLINE - now))
            if [ "$remaining" -le 0 ]; then
              echo "::error::linux-desktop-deps: mirror stall: the ${LINUX_DESKTOP_DEPS_BOUND}s bound is used up ($((now - LINUX_DESKTOP_DEPS_START))s elapsed) before apt-get $phase started"
              return 1
            fi
            sudo timeout --kill-after="$kill_grace" "$remaining" apt-get "$@" || rc=$?
          else
            sudo apt-get "$@" || rc=$?
          fi
          if [ "$rc" -ne 0 ]; then desktop_deps_label_stall "$phase" "$rc"; fi
          return "$rc"
        }
        # The later steps of this action source the helpers and the package list from one file.
        { declare -p packages; declare -f desktop_deps_label_stall desktop_deps_apt; } > "$lib" || exit 1

        bound=0
        if [ -n "$TIMEOUT_MINUTES" ]; then
          if [[ "$TIMEOUT_MINUTES" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            bound=$(awk -v minutes="$TIMEOUT_MINUTES" 'BEGIN { seconds = minutes * 60; whole = int(seconds); print (whole < seconds ? whole + 1 : whole) }')
          fi
          if ! [[ "$bound" =~ ^[0-9]+$ ]] || [ "$bound" -le 0 ]; then
            echo "::error::linux-desktop-deps: timeout-minutes must be a positive number of minutes or empty, got '$TIMEOUT_MINUTES'"
            exit 1
          fi
        fi
        LINUX_DESKTOP_DEPS_START=$(date +%s)
        LINUX_DESKTOP_DEPS_BOUND=$bound
        LINUX_DESKTOP_DEPS_DEADLINE=""
        if [ "$bound" -gt 0 ]; then LINUX_DESKTOP_DEPS_DEADLINE=$((LINUX_DESKTOP_DEPS_START + bound)); fi
        {
          echo "LINUX_DESKTOP_DEPS_START=$LINUX_DESKTOP_DEPS_START"
          echo "LINUX_DESKTOP_DEPS_BOUND=$LINUX_DESKTOP_DEPS_BOUND"
          echo "LINUX_DESKTOP_DEPS_DEADLINE=$LINUX_DESKTOP_DEPS_DEADLINE"
        } >> "$GITHUB_ENV"

        desktop_deps_apt update update || exit $?

        # apt prints no line for a package whose .deb is already in the archive directory, so the
        # set is resolved against the same still-empty directory the download later fills.
        mkdir -p "$archives" || exit 1
        rm -f -- "$archives"/*.deb || exit 1
        uris=$(sudo apt-get -o Dir::Cache::Archives=/tmp/linux-desktop-apt-archives install --print-uris -qq --no-install-recommends "${packages[@]}") || exit $?

        # Key derivation is guarded apart from the apt call above: a derivation failure empties
        # every key output and the packages come from the mirror, but apt's own failure ends the
        # step. The mirror URI is not part of the set, so another mirror host keeps the same key.
        set_prefix=""
        bare_prefix=""
        save_key=""
        reason=""
        derive_keys() {
          local columns codename arch digest
          columns=$(printf '%s\n' "$uris" | awk 'NF != 4 || $4 !~ /^[[:alnum:]]+:[[:xdigit:]]+$/ { bad = 1 } { print $2, $3, $4 } END { exit bad }' | LC_ALL=C sort) || { reason="unexpected apt-get --print-uris output"; return 1; }
          printf '%s\n' "$columns" > "$set_file" || { reason="cannot write the download set"; return 1; }
          # shellcheck source=/dev/null
          codename=$(. /etc/os-release && printf '%s' "${VERSION_CODENAME:-}") || { reason="cannot read VERSION_CODENAME"; return 1; }
          arch=$(dpkg --print-architecture) || { reason="cannot read the dpkg architecture"; return 1; }
          digest=$(printf '%s\n' "$columns" | sha256sum) || { reason="hashing the download set failed"; return 1; }
          digest=${digest%% *}
          if [ -z "$codename" ] || [ -z "$arch" ] || [ -z "${GITHUB_RUN_ID:-}" ] || [ -z "${GITHUB_RUN_ATTEMPT:-}" ] || ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            reason="codename, architecture, run id or digest is empty"
            return 1
          fi
          bare_prefix="linux-desktop-apt-${codename}-${arch}-"
          set_prefix="${bare_prefix}${digest}-"
          save_key="${set_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        }
        rm -f -- "$set_file" || exit 1
        if [ -z "$uris" ]; then
          echo "linux-desktop-deps: every package is already installed; the apt cache steps are skipped"
          : > "$set_file" || exit 1
        elif ! derive_keys; then
          echo "::warning::linux-desktop-deps: cache key derivation failed ($reason); every package comes from the mirror"
          set_prefix=""
          bare_prefix=""
          save_key=""
        fi
        {
          echo "set-prefix=$set_prefix"
          echo "bare-prefix=$bare_prefix"
          echo "save-key=$save_key"
        } >> "$GITHUB_OUTPUT"
        echo "linux-desktop-deps: cache key '${save_key}', restore prefixes '${set_prefix}' and '${bare_prefix}'"

    # The cache is an optimisation: a failed restore degrades to the plain bounded download. The
    # `actions/cache` toolkit annotates its own restore failures.
    - name: Restore the cached apt archives
      id: restore
      if: steps.resolve.outputs.save-key != ''
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: /tmp/linux-desktop-apt-archives/*.deb
        key: ${{ steps.resolve.outputs.save-key }}
        restore-keys: |
          ${{ steps.resolve.outputs.set-prefix }}
          ${{ steps.resolve.outputs.bare-prefix }}

    # apt 3.2 checks only the size of an archive that is already present, so a same-size
    # corrupted file would pass the download and fail later in dpkg. Check each restored file
    # against its size and checksum from the resolved set. A size or checksum mismatch drops that
    # file; a verification error (unsupported checksum type, stat or hash failure) discards every
    # restored file. The download refetches whatever is missing.
    - name: Verify the restored apt archives
      id: verify
      shell: bash
      run: |
        set -uo pipefail
        archives=/tmp/linux-desktop-apt-archives
        set_file="$RUNNER_TEMP/linux-desktop-deps-set.txt"
        reason=""
        verify_restored() {
          local name size checksum file tool actual_size digest
          if [ ! -r "$set_file" ]; then reason="no download set"; return 1; fi
          while read -r name size checksum; do
            file="$archives/$name"
            if [ ! -f "$file" ]; then continue; fi
            # The checksum type is the prefix of the --print-uris column.
            case "${checksum%%:*}" in
              MD5Sum) tool=md5sum ;;
              SHA1) tool=sha1sum ;;
              SHA256) tool=sha256sum ;;
              SHA512) tool=sha512sum ;;
              *) reason="unsupported checksum type ${checksum%%:*}"; return 1 ;;
            esac
            actual_size=$(stat -c %s "$file") || { reason="cannot stat $name"; return 1; }
            digest=$("$tool" "$file") || { reason="$tool failed on $name"; return 1; }
            digest=${digest%% *}
            if [ -z "$digest" ]; then reason="$tool printed no digest for $name"; return 1; fi
            if [ "$actual_size" != "$size" ]; then
              echo "linux-desktop-deps: dropping restored $name: size $actual_size, expected $size"
              rm -f -- "$file" || { reason="cannot delete $name"; return 1; }
            elif [ "$digest" != "${checksum#*:}" ]; then
              echo "linux-desktop-deps: dropping restored $name: ${checksum%%:*} $digest, expected ${checksum#*:}"
              rm -f -- "$file" || { reason="cannot delete $name"; return 1; }
            fi
          done < "$set_file"
          return 0
        }
        if ! verify_restored; then
          echo "::warning::linux-desktop-deps: verifying the restored apt archives failed ($reason); discarding them, every package comes from the mirror"
          find "$archives" -maxdepth 1 -name '*.deb' -delete || true
        fi
        exit 0

    - name: Download the missing apt archives
      id: download
      shell: bash
      run: |
        # `packages` and `desktop_deps_apt` come from the sourced library.
        # shellcheck disable=SC2154
        set -uo pipefail
        archives=/tmp/linux-desktop-apt-archives
        set_file="$RUNNER_TEMP/linux-desktop-deps-set.txt"
        # shellcheck source=/dev/null
        source "$RUNNER_TEMP/linux-desktop-deps-lib.sh" || exit 1

        missing=-1
        if [ -r "$set_file" ]; then
          missing=0
          while read -r name _; do
            if [ ! -f "$archives/$name" ]; then missing=$((missing + 1)); fi
          done < "$set_file"
        fi

        download_args=(-o Dir::Cache::Archives=/tmp/linux-desktop-apt-archives install --download-only -y --no-install-recommends "${packages[@]}")
        desktop_deps_apt download "${download_args[@]}" || exit $?

        # An undetermined set emits nothing, which the save guard reads as "do not save".
        if [ "$missing" -gt 0 ]; then
          echo "fetched=true" >> "$GITHUB_OUTPUT"
        elif [ "$missing" -eq 0 ]; then
          echo "fetched=false" >> "$GITHUB_OUTPUT"
        fi

    # Bound the cache: keep one resolved set (about 64 MB). A failing prune keeps every file,
    # which a --no-download install tolerates, and reports ok=false so the unpruned set is not
    # saved.
    - name: Prune archives outside the download set
      id: prune
      shell: bash
      run: |
        set -uo pipefail
        archives=/tmp/linux-desktop-apt-archives
        set_file="$RUNNER_TEMP/linux-desktop-deps-set.txt"
        reason=""
        prune_unneeded() {
          local -A wanted=()
          local name file
          if [ ! -r "$set_file" ]; then reason="no download set"; return 1; fi
          while read -r name _; do
            wanted[$name]=1
          done < "$set_file"
          for file in "$archives"/*.deb; do
            if [ ! -e "$file" ]; then continue; fi
            name=${file##*/}
            if [ -z "${wanted[$name]:-}" ]; then
              echo "linux-desktop-deps: pruning $name, it is not in the download set"
              rm -f -- "$file" || { reason="cannot delete $name"; return 1; }
            fi
          done
          return 0
        }
        if prune_unneeded; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::linux-desktop-deps: pruning the apt archives failed ($reason); the cache is not saved"
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    # Save only a set that the download changed and the prune completed. A failed save,
    # including a reservation conflict with a parallel job, is a warning and never fails the job.
    - name: Save the downloaded apt archives
      id: save
      if: steps.resolve.outputs.save-key != '' && steps.download.outputs.fetched == 'true' && steps.prune.outputs.ok == 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: /tmp/linux-desktop-apt-archives/*.deb
        key: ${{ steps.resolve.outputs.save-key }}

    # `--no-download`: a missing archive fails at once and by name instead of starting an
    # unbounded mirror fetch.
    - name: Install the Linux desktop build dependencies
      id: install
      shell: bash
      run: |
        # `packages` comes from the sourced library.
        # shellcheck disable=SC2154
        set -uo pipefail
        # shellcheck source=/dev/null
        source "$RUNNER_TEMP/linux-desktop-deps-lib.sh" || exit 1
        sudo apt-get -o Dir::Cache::Archives=/tmp/linux-desktop-apt-archives install --no-download --no-install-recommends -y "${packages[@]}"
